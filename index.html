<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Ezekiel Lewis" />
  <title>Around the U.S.</title>
  <link rel="stylesheet" href="pages/index.css" />
</head>

<body class="page">
  <div class="page__content">
    <header class="header page__section">
      <img src="images/around_us.svg" alt="Around the us header" class="header__logo" />
    </header>
    <main class="content">
      <section class="profile page__section">
        <img src="./images/jacques-cousteau.jpg" alt="avatar" class="profile__image" />
        <div class="profile__info">
          <h1 class="profile__title">Jacques Cousteau</h1>
          <button type="button" class="profile__edit-button"></button>
          <p class="profile__description">Explorer</p>
        </div>
        <button type="button" class="profile__add-button"></button>
      </section>

      <section class="cards page__section">
        <ul class="cards__list"></ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__paragraph">&copy; 2024 Around The U.S.</p>
    </footer>
  </div>

  <!-- Profile Edit Modal -->
  <div class="modal" id="edit-modal">
    <div class="modal__content">
      <button type="button" class="modal__close"></button>
      <p class="modal__heading">Edit Profile</p>
      <form class="modal__form">
        <input type="text" name="title" placeholder="Name" class="modal__input modal__input_type_name" />
        <input type="text" name="description" placeholder="Description"
          class="modal__input modal__input_type_description" />

        <button type="submit" class="modal__button">Save</button>
      </form>
    </div>
  </div>

  <!-- Profile Add Modal -->
  <div class="modal" id="add-card-modal">
    <div class="modal__content">
      <button type="button" class="modal__close"></button>
      <h3 class="modal__title">New Place</h3>
      <form class="modal__form" id="add-card-form">
        <input type="text" name="title" placeholder="Title" class="modal__input modal__input_type_title" />

        <input type="text" name="url" placeholder="Image URL" class="modal__input modal__input_type_url" />

        <button type="submit" class="button modal__button">Save</button>
      </form>
    </div>
  </div>


  <template id="card-template">
    <li class="card">
      <button type="button" class="card__delete-button"></button>
      <img src="" alt="" class="card__image" />

      <div class="card__description">
        <h2 class="card__title"></h2>
        <button type="button" class="card__like-button"></button>
      </div>
    </li>
  </template>
  <script src="scripts/index.js"></script>

</body>

</html>
